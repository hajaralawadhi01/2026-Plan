<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hajar's Life Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#F7F5EF;
  --surface:#FFFFFF;
  --surface-2:#F1EEE2;
  --surface-3:#EAE6D6;
  --border:#E1DBC7;
  --text:#25261E;
  --text-muted:#6B6A57;
  --text-faint:#96937C;
  --shadow:0 1px 2px rgba(37,38,30,.05), 0 10px 28px -14px rgba(37,38,30,.22);
  --shadow-lg:0 4px 10px rgba(37,38,30,.08), 0 24px 48px -18px rgba(37,38,30,.32);
  --radius-sm:8px;
  --radius:14px;
  --radius-lg:22px;

  --hub:#3B5A52; --hub-soft:#E7EEE9; --hub-dark:#26443B;
  --success:#2F9E5C; --success-soft:#E4F5EA;
  --warning:#C9862B; --warning-soft:#FBF0DF;
  --danger:#C94F5E; --danger-soft:#FBE7EA;

  --accent:var(--hub); --accent-soft:var(--hub-soft); --accent-dark:var(--hub-dark); --accent2:var(--hub);

  --p1:#2F7D4F; --p1-soft:#E4F3E9; --p1-dark:#1F5636;
  --p2:#0F7A6C; --p2-soft:#E1F3EF; --p2-dark:#0B5B50; --p2b:#B8860B; --p2b-soft:#F7EDD6;
  --p3:#0E7490; --p3-soft:#E1F2F6; --p3-dark:#0A5568;
  --p4:#BC5B6B; --p4-soft:#FBEAEC; --p4-dark:#8F3F4C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15170F; --surface:#1E2118; --surface-2:#262A1E; --surface-3:#2E331F;
    --border:#363B2A; --text:#ECEADD; --text-muted:#A8A68F; --text-faint:#75765E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.6);
    --shadow-lg:0 6px 16px rgba(0,0,0,.45), 0 30px 60px -20px rgba(0,0,0,.7);
    --hub:#83AC98; --hub-soft:#1D2B23; --hub-dark:#BFDBCB;
    --success:#59C084; --success-soft:#17301F;
    --warning:#E0A64A; --warning-soft:#332711;
    --danger:#E2818E; --danger-soft:#332025;
    --p1:#63BC85; --p1-soft:#173625; --p1-dark:#BEE5CE;
    --p2:#4FBBA8; --p2-soft:#12352F; --p2-dark:#B7E7DD; --p2b:#DDB25C; --p2b-soft:#332711;
    --p3:#57B7D4; --p3-soft:#0F2E38; --p3-dark:#BCE5F1;
    --p4:#E38B99; --p4-soft:#33202A; --p4-dark:#F4C4CC;
  }
}
:root[data-theme="dark"]{
  --bg:#15170F; --surface:#1E2118; --surface-2:#262A1E; --surface-3:#2E331F;
  --border:#363B2A; --text:#ECEADD; --text-muted:#A8A68F; --text-faint:#75765E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 6px 16px rgba(0,0,0,.45), 0 30px 60px -20px rgba(0,0,0,.7);
  --hub:#83AC98; --hub-soft:#1D2B23; --hub-dark:#BFDBCB;
  --success:#59C084; --success-soft:#17301F;
  --warning:#E0A64A; --warning-soft:#332711;
  --danger:#E2818E; --danger-soft:#332025;
  --p1:#63BC85; --p1-soft:#173625; --p1-dark:#BEE5CE;
  --p2:#4FBBA8; --p2-soft:#12352F; --p2-dark:#B7E7DD; --p2b:#DDB25C; --p2b-soft:#332711;
  --p3:#57B7D4; --p3-soft:#0F2E38; --p3-dark:#BCE5F1;
  --p4:#E38B99; --p4-soft:#33202A; --p4-dark:#F4C4CC;
}

/* page accent context */
.page-dashboard{ --accent:var(--hub); --accent-soft:var(--hub-soft); --accent-dark:var(--hub-dark); --accent2:var(--hub); }
.page-p1{ --accent:var(--p1); --accent-soft:var(--p1-soft); --accent-dark:var(--p1-dark); --accent2:var(--p1); }
.page-p2{ --accent:var(--p2); --accent-soft:var(--p2-soft); --accent-dark:var(--p2-dark); --accent2:var(--p2b); }
.page-p3{ --accent:var(--p3); --accent-soft:var(--p3-soft); --accent-dark:var(--p3-dark); --accent2:var(--p3); }
.page-p4{ --accent:var(--p4); --accent-soft:var(--p4-soft); --accent-dark:var(--p4-dark); --accent2:var(--p4); }

/* ============================================================
   RESET / BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; min-height:100vh;
}
h1,h2,h3,h4{ font-family:"Fraunces",Georgia,serif; font-weight:600; text-wrap:balance; margin:0; color:var(--text); }
p{margin:0;}
a{color:inherit;}
button,input,textarea,select{ font-family:inherit; font-size:inherit; color:inherit; }
button{cursor:pointer;}
::selection{ background:var(--accent-soft); color:var(--accent-dark); }
.mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
.visually-hidden{ position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

/* ============================================================
   LAYOUT
   ============================================================ */
#app{ display:flex; width:100%; min-height:100vh; }

.sidebar{
  width:260px; flex:0 0 260px; background:var(--surface);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  padding:22px 0 18px; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:40;
}
.brand{ display:flex; align-items:baseline; gap:8px; padding:0 22px 20px; border-bottom:1px solid var(--border); margin-bottom:14px; }
.brand-mark{ font-family:"Fraunces",serif; font-weight:600; font-size:1.5rem; font-style:italic; color:var(--hub-dark); }
.brand-sub{ font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); }

.nav{ display:flex; flex-direction:column; gap:3px; padding:0 10px; }
.nav-item{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  background:transparent; border:none; border-left:4px solid transparent;
  border-radius:0 10px 10px 0; padding:10px 12px 10px 10px;
  color:var(--text-muted); font-weight:600; font-size:.87rem;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.nav-item:hover{ background:var(--surface-2); color:var(--text); }
.nav-item.active{ background:var(--accent-soft); color:var(--accent-dark); border-left-color:var(--accent); }
.nav-item .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; background:var(--dot,var(--hub)); }
.nav-item .ic{ width:18px;height:18px; flex:0 0 auto; display:flex; }
.nav-item .ic svg{ width:100%; height:100%; }
.nav-1 .dot{ background:var(--p1); } .nav-2 .dot{ background:var(--p2); }
.nav-3 .dot{ background:var(--p3); } .nav-4 .dot{ background:var(--p4); }
.nav-0 .dot{ background:var(--hub); }

.sidebar-foot{ margin-top:auto; padding:16px 22px 0; border-top:1px solid var(--border); }
.storage-note{ font-size:.72rem; color:var(--text-faint); line-height:1.5; }

.main-col{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }

.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
  gap:16px; padding:16px 28px; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
}
.topbar-left{ display:flex; align-items:center; gap:14px; min-width:0; }
.hamburger{ display:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); width:36px;height:36px; align-items:center; justify-content:center; flex:0 0 auto; }
.hamburger svg{ width:18px;height:18px; }
.page-heading{ min-width:0; }
.page-heading h1{ font-size:1.5rem; line-height:1.2; }
.page-heading .sub{ font-size:.8rem; color:var(--text-muted); margin-top:2px; }
.topbar-right{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }

.main{ flex:1 1 auto; padding:24px 28px 60px; }
.section{ margin-bottom:30px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.section-head h2{ font-size:1.15rem; }
.section-head .desc{ font-size:.8rem; color:var(--text-muted); }

.overlay{ position:fixed; inset:0; background:rgba(20,20,14,.45); backdrop-filter:blur(1px); z-index:45; display:none; }
.overlay.show{ display:block; }

/* ============================================================
   PRIMITIVES
   ============================================================ */
.grid-3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:16px; }
.grid-2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
.stack{ display:flex; flex-direction:column; gap:10px; }
.row{ display:flex; align-items:center; gap:10px; }
.row.wrap{ flex-wrap:wrap; }
.between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
.card.pad-sm{ padding:14px; }
.card-title{ font-family:"Fraunces",serif; font-weight:600; font-size:1.02rem; }
.card-eyebrow{ font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--accent-dark); font-weight:700; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface);
  color:var(--text); font-weight:600; font-size:.83rem; padding:8px 14px;
  transition:background .12s, border-color .12s, transform .05s, color .12s;
}
.btn:hover{ background:var(--surface-2); }
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover{ filter:brightness(1.07); background:var(--accent); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-danger{ color:var(--danger); }
.btn-sm{ padding:5px 10px; font-size:.75rem; }
.btn-icon{ width:32px; height:32px; padding:0; flex:0 0 auto; }
.btn-icon svg{ width:15px;height:15px; }
.btn svg{ width:15px; height:15px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

.fab{
  position:fixed; right:26px; bottom:26px; z-index:35; width:54px; height:54px; border-radius:50%;
  background:var(--accent); color:#fff; border:none; box-shadow:var(--shadow-lg);
  display:none; align-items:center; justify-content:center;
}
.fab svg{ width:22px;height:22px; }

.chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:.72rem; font-weight:700; background:var(--accent-soft); color:var(--accent-dark); white-space:nowrap; }
.chip.status-present, .chip.status-done, .chip.status-posted, .chip.status-completed{ background:var(--success-soft); color:var(--success); }
.chip.status-absent, .chip.status-overdue{ background:var(--danger-soft); color:var(--danger); }
.chip.status-excused, .chip.status-pending, .chip.status-idea, .chip.status-draft{ background:var(--warning-soft); color:var(--warning); }
.chip.status-inprogress, .chip.status-reading, .chip.status-scheduled, .chip.status-active{ background:var(--accent-soft); color:var(--accent-dark); }
.chip-outline{ background:transparent; border:1px solid var(--border); color:var(--text-muted); }

.progress{ height:8px; background:var(--surface-3); border-radius:999px; overflow:hidden; }
.progress > span{ display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .25s ease; }

.empty{ text-align:center; padding:28px 16px; color:var(--text-faint); font-size:.85rem; }
.empty svg{ width:26px;height:26px; margin:0 auto 8px; opacity:.5; display:block; }

.table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
table{ width:100%; border-collapse:collapse; min-width:560px; }
thead th{ text-align:left; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); font-weight:700; padding:10px 14px; background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap; }
tbody td{ padding:11px 14px; border-bottom:1px solid var(--border); font-size:.86rem; vertical-align:middle; }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background:var(--surface-2); }

.kanban{ display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; }
.kanban-col{ flex:0 0 270px; background:var(--surface-2); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:10px; }
.kanban-col-head{ display:flex; align-items:center; justify-content:space-between; padding:2px 4px; }
.kanban-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-size:.82rem; }

.stepper{ display:flex; flex-direction:column; gap:0; }
.step{ display:flex; gap:14px; }
.step-track{ display:flex; flex-direction:column; align-items:center; }
.step-dot{ width:26px; height:26px; border-radius:50%; border:2px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; flex:0 0 auto; font-size:.7rem; font-weight:700; color:var(--text-faint); }
.step-line{ width:2px; flex:1; background:var(--border); min-height:26px; }
.step.done .step-dot{ background:var(--accent); border-color:var(--accent); color:#fff; }
.step.inprogress .step-dot{ border-color:var(--accent); color:var(--accent-dark); }
.step.done .step-line{ background:var(--accent); }
.step-body{ padding-bottom:20px; flex:1; min-width:0; }

.avatar-num{ width:22px;height:22px;border-radius:6px;background:var(--accent-soft); color:var(--accent-dark); font-size:.65rem; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }

textarea, input[type=text], input[type=number], input[type=date], input[type=url], select{
  width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:9px 11px; font-size:.85rem; color:var(--text);
}
textarea{ resize:vertical; min-height:70px; font-family:inherit; }
label{ font-size:.75rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:5px; }
.field{ margin-bottom:14px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* ============================================================
   MODAL
   ============================================================ */
.modal-wrap{ position:fixed; inset:0; z-index:60; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:6vh 16px; }
.modal-wrap.show{ display:flex; }
.modal-backdrop{ position:fixed; inset:0; background:rgba(18,18,12,.5); backdrop-filter:blur(2px); }
.modal{ position:relative; width:100%; max-width:480px; background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:24px; border:1px solid var(--border); }
.modal.confirm{ max-width:380px; }
.modal-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; gap:10px; }
.modal-head h3{ font-size:1.15rem; }
.modal-close{ background:transparent; border:none; color:var(--text-faint); width:28px;height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.modal-close:hover{ background:var(--surface-2); }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
.modal p.msg{ font-size:.88rem; color:var(--text-muted); line-height:1.55; }

.toast-stack{ position:fixed; top:16px; right:16px; z-index:80; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--text); color:var(--bg); font-size:.8rem; font-weight:600; padding:10px 16px; border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); opacity:0; transform:translateY(-6px); transition:opacity .18s, transform .18s; }
.toast.show{ opacity:1; transform:translateY(0); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 980px){
  .sidebar{ position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow-lg); }
  .sidebar.open{ transform:translateX(0); }
  .hamburger{ display:flex; }
  .fab{ display:flex; }
  .main{ padding:18px 16px 90px; }
  .topbar{ padding:14px 16px; }
}
@media (min-width: 981px){
  .fab{ display:none !important; }
}
</style>
</head>
<body class="page-dashboard">

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">Hub</span>
      <span class="brand-sub">Life Organizer</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <p class="storage-note">Saved automatically to this browser's local storage. Nothing leaves your device.</p>
    </div>
  </aside>

  <div class="overlay" id="overlay" data-action="toggle-sidebar"></div>

  <div class="main-col">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburgerBtn" data-action="toggle-sidebar" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-heading">
          <h1 id="pageTitle">Command Center</h1>
          <div class="sub" id="pageSub"></div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" data-action="quick-add" id="quickAddBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span id="quickAddLabel">Add</span>
        </button>
        <button class="btn btn-icon" id="themeToggle" data-action="toggle-theme" aria-label="Toggle theme"></button>
      </div>
    </header>

    <main class="main" id="main"></main>
  </div>
</div>

<button class="fab" id="fabAdd" data-action="quick-add" aria-label="Add">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div class="modal-wrap" id="modalWrap"></div>
<div class="toast-stack" id="toastStack"></div>

<script>
/* ============================================================
   ICONS
   ============================================================ */
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C10 4 4 10 4 18v2h2c8 0 14-6 14-16Z"/><path d="M9 15c4-2 7-5 9-9"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 6 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-6-3.8-9S9.5 5.7 12 3Z"/></svg>',

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);
const pad2 = n => String(n).padStart(2,'0');
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
}
function fmtDateShort(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB',{day:'numeric', month:'short'});
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(n,d){ return d>0 ? Math.round((n/d)*100) : 0; }

function toast(msg){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  stack.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),200); }, 2600);
}

function commit(){ persist(); render(); }

/* generic CRUD factory over an array reachable via getter/setter closures */
function crud(get,set){
  return {
    add(item){ const arr=get(); arr.push(item); set(arr); commit(); return item; },
    remove(id){ set(get().filter(x=>x.id!==id)); commit(); },
    update(id,patch){ const arr=get(); const it=arr.find(x=>x.id===id); if(it) Object.assign(it,patch); commit(); },
    find(id){ return get().find(x=>x.id===id); },
  };
}

const modalWrap = document.getElementById('modalWrap');

function closeModal(){
  modalWrap.classList.remove('show');
  modalWrap.innerHTML = '';
}
modalWrap.addEventListener('click', (e)=>{ if(e.target.classList.contains('modal-backdrop')) closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

function fieldHTML(f, initial){
  const val = initial && initial[f.key] !== undefined ? initial[f.key] : (f.default !== undefined ? f.default : '');
  const id = 'f_'+f.key;
  let input = '';
  if(f.type === 'textarea'){
    input = `<textarea id="${id}" name="${f.key}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''}>${esc(val)}</textarea>`;
  } else if(f.type === 'select'){
    input = `<select id="${id}" name="${f.key}">${f.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(val)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
  } else if(f.type === 'number'){
    input = `<input type="number" id="${id}" name="${f.key}" value="${esc(val)}" ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''} placeholder="${esc(f.placeholder||'')}">`;
  } else if(f.type === 'date'){
    input = `<input type="date" id="${id}" name="${f.key}" value="${esc(val)}">`;
  } else if(f.type === 'time'){
    input = `<input type="time" id="${id}" name="${f.key}" value="${esc(val)}">`;
  } else {
    input = `<input type="text" id="${id}" name="${f.key}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''}>`;
  }
  const half = f.half ? 'style="min-width:0"' : '';
  return `<div class="field" ${half}><label for="${id}">${esc(f.label)}</label>${input}</div>`;
}

function openFormModal({title, fields, initial, submitLabel='Save', onSubmit}){
  const rows = [];
  for(let i=0;i<fields.length;i++){
    if(fields[i].half && fields[i+1] && fields[i+1].half){
      rows.push(`<div class="field-row">${fieldHTML(fields[i],initial)}${fieldHTML(fields[i+1],initial)}</div>`);
      i++;
    } else rows.push(fieldHTML(fields[i], initial));
  }
  modalWrap.innerHTML = `
    <div class="modal-backdrop"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${esc(title)}</h3>
        <button class="modal-close" data-close>${ICONS.close}</button>
      </div>
      <form id="dynForm">
        ${rows.join('')}
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">${esc(submitLabel)}</button>
        </div>
      </form>
    </div>`;
  modalWrap.classList.add('show');
  modalWrap.querySelectorAll('[data-close]').forEach(b=> b.addEventListener('click', closeModal));
  modalWrap.querySelector('#dynForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const data = {};
    fields.forEach(f=>{
      const el = document.getElementById('f_'+f.key);
      let v = el.value;
      if(f.type==='number') v = v===''? 0 : Number(v);
      data[f.key] = v;
    });
    onSubmit(data);
    closeModal();
  });
  setTimeout(()=>{ const first = modalWrap.querySelector('input,textarea,select'); if(first) first.focus(); }, 30);
}

function confirmAction({title='Are you sure?', message, danger=true, confirmLabel='Delete', onConfirm}){
  modalWrap.innerHTML = `
    <div class="modal-backdrop"></div>
    <div class="modal confirm" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close" data-close>${ICONS.close}</button></div>
      <p class="msg">${esc(message||'This action cannot be undone.')}</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="button" class="btn ${danger?'btn-danger':'btn-primary'}" id="confirmBtn">${esc(confirmLabel)}</button>
      </div>
    </div>`;
  modalWrap.classList.add('show');
  modalWrap.querySelectorAll('[data-close]').forEach(b=> b.addEventListener('click', closeModal));
  modalWrap.querySelector('#confirmBtn').addEventListener('click', ()=>{ onConfirm(); closeModal(); });
}

   ============================================================ */
function attendanceStats(course){
  const s = course.sessions || [];
  const present = s.filter(x=>x.status==='present').length;
  const absent = s.filter(x=>x.status==='absent').length;
  const excused = s.filter(x=>x.status==='excused').length;
  const denom = present + absent;
  return { present, absent, excused, total:s.length, percent: denom>0 ? Math.round((present/denom)*100) : 100 };
}
function attendanceTone(p){ return p>=90 ? 'success' : p>=75 ? 'warning' : 'danger'; }

const CATEGORY_COLOR = {work:'p3', studies:'p1', personal:'p4', class:'p2'};
const SDG_LIST = [
  {n:1,t:'No Poverty'},{n:2,t:'Zero Hunger'},{n:3,t:'Good Health'},{n:4,t:'Quality Education'},
  {n:5,t:'Gender Equality'},{n:6,t:'Clean Water'},{n:7,t:'Clean Energy'},{n:8,t:'Decent Work'},
  {n:9,t:'Industry & Innovation'},{n:10,t:'Reduced Inequalities'},{n:11,t:'Sustainable Cities'},
  {n:12,t:'Responsible Consumption'},{n:13,t:'Climate Action'},{n:14,t:'Life Below Water'},
  {n:15,t:'Life on Land'},{n:16,t:'Peace & Justice'},{n:17,t:'Partnerships'},
];
function sdgChip(n){ const s = SDG_LIST.find(x=>x.n===n); return `<span class="chip chip-outline" title="${s?esc(s.t):''}">SDG ${n}</span>`; }

function thesisStep(m, isLast){
  const cls = m.status==='done'?'done':m.status==='inprogress'?'inprogress':'';
  const icon = m.status==='done' ? ICONS.check : '';
  return `<div class="step ${cls}">

    <div class="step-body">

        <span style="font-weight:700;font-size:.9rem">${esc(m.name)}</span>
        <select data-action="thesis-status" data-id="${m.id}" style="width:auto;padding:4px 8px;font-size:.72rem;font-weight:700">
          ${THESIS_STAGE_ORDER.map(st=>`<option value="${st}" ${st===m.status?'selected':''}>${THESIS_STAGE_LABEL[st]}</option>`).join('')}
        </select>
      </div>
      <p style="font-size:.8rem;color:var(--text-muted);margin-bottom:6px">${esc(m.notes)||'<span style="color:var(--text-faint)">No notes yet.</span>'}</p>

    </div>
  </div>`;
}

function groupBy(arr, key){
  const map = new Map();
  arr.forEach(item=>{ const k = item[key]||'Other'; if(!map.has(k)) map.set(k,[]); map.get(k).push(item); });
  return Array.from(map.entries());
}

      {key:'totalRows', label:'Total rows', type:'number', half:true, default:20, min:1},
      {key:'yarn', label:'Yarn', type:'text', placeholder:'Fibre, colour, amount'},
      {key:'status', label:'Status', type:'select', options:[{value:'planned',label:'Planned'},{value:'in progress',label:'In progress'},{value:'completed',label:'Completed'}]},
      {key:'notes', label:'Notes (optional)', type:'textarea'},
    ],
    onSubmit(d){ cP4Crochet.add({id:uid(), name:d.name, hook:d.hook, yarn:d.yarn, totalRows:Number(d.totalRows)||1, rows:0, status:d.status, notes:d.notes}); }
  });
}
function openQuranModal(){
  openFormModal({
    title:'Add surah to memorize', submitLabel:'Add',
    fields:[
      {key:'surah', label:'Surah / passage', type:'text', required:true, placeholder:"e.g. Surah Al-Mulk"},
      {key:'totalVerses', label:'Total verses', type:'number', half:true, default:10, min:1},
      {key:'memorizedVerses', label:'Memorized so far', type:'number', half:true, default:0, min:0},
      {key:'intervalDays', label:'Revision interval (days)', type:'number', default:3, min:1},
    ],
    onSubmit(d){ cP4Quran.add({id:uid(), surah:d.surah, totalVerses:Number(d.totalVerses)||1, memorizedVerses:Number(d.memorizedVerses)||0, intervalDays:Number(d.intervalDays)||3, lastRevised:todayISO()}); }
  });
}
function openBookModal(){
  openFormModal({
    title:'Add book', submitLabel:'Add',
    fields:[
      {key:'title', label:'Title', type:'text', required:true},
      {key:'author', label:'Author', type:'text'},
      {key:'totalPages', label:'Total pages', type:'number', half:true, default:200, min:1},
      {key:'status', label:'Status', type:'select', half:true, options:[{value:'want',label:'Want to Read'},{value:'reading',label:'Reading'},{value:'completed',label:'Completed'}]},
    ],
    onSubmit(d){ cP4Books.add({id:uid(), title:d.title, author:d.author, totalPages:Number(d.totalPages)||1, pagesRead: d.status==='completed'?Number(d.totalPages)||1:0, status:d.status, quotes:[]}); }
  });
}
function openQuoteModal(bookId){
  openFormModal({
    title:'Save a quote', submitLabel:'Save',
    fields:[
      {key:'text', label:'Quote', type:'textarea', required:true},
      {key:'page', label:'Page (optional)', type:'text', placeholder:'p.42'},
    ],
    onSubmit(d){ const b = cP4Books.find(bookId); if(!b) return; b.quotes.push({id:uid(), text:d.text, page:d.page}); commit(); }
  });
}
function openEvent4Modal(){
  openFormModal({
    title:'Add event', submitLabel:'Add',
    fields:[
      {key:'title', label:'Event title', type:'text', required:true},
      {key:'date', label:'Date', type:'date', half:true, default:todayISO()},
      {key:'type', label:'Role', type:'select', half:true, options:[{value:'attend',label:'Attending'},{value:'host',label:'Hosting / speaking'}]},
      {key:'prep', label:'Prep notes / speech outline', type:'textarea'},
    ],
    onSubmit(d){ cP4Events.add({id:uid(), title:d.title, date:d.date||todayISO(), type:d.type, prep:d.prep}); }
  });
}
function openSocialModal(){
  openFormModal({
    title:'Add content idea', submitLabel:'Add',
    fields:[
      {key:'platform', label:'Platform', type:'select', half:true, options:[{value:'linkedin',label:'LinkedIn'},{value:'instagram',label:'Instagram'}]},
      {key:'date', label:'Target date', type:'date', half:true, default:todayISO()},
      {key:'caption', label:'Caption', type:'textarea', required:true},
      {key:'hashtags', label:'Hashtags', type:'text', placeholder:'#Sustainability, #Bahrain'},
      {key:'status', label:'Status', type:'select', options:SOCIAL_STATUS_ORDER.map(s=>({value:s,label:SOCIAL_STATUS_LABEL[s]}))},
    ],
    onSubmit(d){ cP4Social.add({id:uid(), platform:d.platform, date:d.date||todayISO(), caption:d.caption, hashtags:d.hashtags, status:d.status}); }
  });
}

/* ============================================================
   DOMAIN ACTIONS
   ============================================================ */
function markAttendance(pillar, courseId, status){
  const c = (pillar==='p1'?cP1Courses:cP2Courses).find(courseId);
  if(!c) return;
  const T = todayISO();
  const existing = c.sessions.find(s=>s.date===T);
  if(existing) existing.status = status; else c.sessions.push({date:T, status});
  cLogs.add({id:uid(), type:'attendance', text:`${status[0].toUpperCase()+status.slice(1)} — ${c.name}`, date:T, ts:Date.now()});
}

/* ============================================================
   ACTION DISPATCH
   ============================================================ */
const QUICK_ADD_OPENER = { dashboard:openTaskModal, p1:()=>openCourseModal('p1'), p2:()=>openCourseModal('p2'), p3:openProgramModal, p4:openCrochetModal };

const ACTIONS = {
  'nav'(el){ state.activePage = el.dataset.page; document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); commit(); window.scrollTo(0,0); },
  'toggle-sidebar'(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); },
  'toggle-theme'(){ state.theme = state.theme==='dark' ? 'light' : 'dark'; commit(); },
  'quick-add'(){ (QUICK_ADD_OPENER[state.activePage]||openTaskModal)(); },

  'toggle-task'(el){ const t = cTasks.find(el.dataset.id); if(t) cTasks.update(t.id,{done:!t.done}); },
  'delete-task'(el){ cTasks.remove(el.dataset.id); },
  'delete-timeline'(el){ cTimeline.remove(el.dataset.id); },
  'quick-log-attendance'(){ openQuickAttendanceModal(); },
  'quick-log-reading'(){ openQuickReadingModal(); },
  'quick-log-note'(){ openQuickNoteModal(); },

  'add-course'(el){ openCourseModal(el.dataset.pillar); },
  'mark-attendance'(el){ markAttendance(el.dataset.pillar, el.dataset.id, el.dataset.status); },
  'delete-course'(el){
    const c = (el.dataset.pillar==='p1'?cP1Courses:cP2Courses).find(el.dataset.id);
    confirmAction({ title:'Remove module?', message:`"${c?c.name:'This module'}" and its attendance history will be deleted.`,
      onConfirm(){ (el.dataset.pillar==='p1'?cP1Courses:cP2Courses).remove(el.dataset.id); } });
  },
  'edit-thesis-notes'(el){
    const m = state.p1.thesis.milestones.find(x=>x.id===el.dataset.id);
    openFormModal({ title:`Notes — ${m.name}`, submitLabel:'Save',
      fields:[{key:'notes', label:'Notes', type:'textarea', default:m.notes}],
      onSubmit(d){ m.notes = d.notes; commit(); } });
  },
  'add-material'(){ openMaterialModal(); },
  'delete-material'(el){ cP1Materials.remove(el.dataset.id); },
  'add-feed'(){ openFeedModal(); },
  'delete-feed'(el){ cP1Feed.remove(el.dataset.id); },

  'add-memo'(){ openMemoModal(); },
  'delete-memo'(el){ cP2Memo.remove(el.dataset.id); },
  'memo-revised'(el){ cP2Memo.update(el.dataset.id, {lastRevised:todayISO()}); toast('Marked as revised'); },
  'memo-progress'(el){ const m = cP2Memo.find(el.dataset.id); if(m) cP2Memo.update(m.id, {completedUnits: clamp(m.completedUnits+1,0,m.totalUnits)}); },
  'add-checklist-item'(){ openChecklistModal(); },
  'toggle-checklist'(el){ const it = cP2Checklist.find(el.dataset.id); if(it) cP2Checklist.update(it.id,{done:!it.done}); },
  'delete-checklist'(el){ cP2Checklist.remove(el.dataset.id); },
  'add-note'(){ openP2NoteModal(); },
  'delete-note'(el){ cP2Notes.remove(el.dataset.id); },

  'add-program'(){ openProgramModal(); },
  'delete-program'(el){ cP3Programs.remove(el.dataset.id); },
  'add-event3'(){ openEvent3Modal(); },
  'delete-event3'(el){ cP3Events.remove(el.dataset.id); },
  'add-deliverable'(){ openDeliverableModal(); },
  'delete-deliverable'(el){ cP3Deliv.remove(el.dataset.id); },

  'add-crochet'(){ openCrochetModal(); },
  'delete-crochet'(el){ cP4Crochet.remove(el.dataset.id); },
  'crochet-inc'(el){ const c = cP4Crochet.find(el.dataset.id); if(c) cP4Crochet.update(c.id,{rows: clamp(c.rows+1,0,c.totalRows)}); },
  'crochet-dec'(el){ const c = cP4Crochet.find(el.dataset.id); if(c) cP4Crochet.update(c.id,{rows: clamp(c.rows-1,0,c.totalRows)}); },
  'add-quran'(){ openQuranModal(); },
  'delete-quran'(el){ cP4Quran.remove(el.dataset.id); },
  'quran-revised'(el){ cP4Quran.update(el.dataset.id, {lastRevised:todayISO()}); toast('Marked as revised'); },
  'quran-progress'(el){ const m = cP4Quran.find(el.dataset.id); if(m) cP4Quran.update(m.id, {memorizedVerses: clamp(m.memorizedVerses+1,0,m.totalVerses)}); },
  'add-book'(){ openBookModal(); },
  'delete-book'(el){ cP4Books.remove(el.dataset.id); },
  'book-progress'(el){
    const b = cP4Books.find(el.dataset.id); if(!b) return;
    const delta = Number(el.dataset.delta)||0;
    const pagesRead = clamp(b.pagesRead+delta, 0, b.totalPages);
    const status = pagesRead>=b.totalPages ? 'completed' : (b.status==='want' && pagesRead>0 ? 'reading' : b.status);
    cP4Books.update(b.id, {pagesRead, status});
  },
  'add-quote'(el){ openQuoteModal(el.dataset.id); },
  'add-event4'(){ openEvent4Modal(); },
  'delete-event4'(el){ cP4Events.remove(el.dataset.id); },
  'add-social'(){ openSocialModal(); },
  'delete-social'(el){ cP4Social.remove(el.dataset.id); },
  'social-status'(el){
    const s = cP4Social.find(el.dataset.id); if(!s) return;
    const idx = SOCIAL_STATUS_ORDER.indexOf(s.status);
    cP4Social.update(s.id, {status: SOCIAL_STATUS_ORDER[(idx+1)%SOCIAL_STATUS_ORDER.length]});
  },
};

const CHANGE_ACTIONS = {
  'thesis-status'(el){ const m = state.p1.thesis.milestones.find(x=>x.id===el.dataset.id); if(m){ m.status = el.value; commit(); } },
  'deliverable-bucket'(el){ cP3Deliv.update(el.dataset.id, {bucket: el.value}); },
};

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const fn = ACTIONS[el.dataset.action];
  if(fn) fn(el);
});
document.addEventListener('change', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const fn = CHANGE_ACTIONS[el.dataset.action];
  if(fn) fn(el);
});

/* delete confirmations for simple single-array items (wrap risky deletes) */
['delete-material','delete-feed','delete-memo','delete-checklist','delete-note','delete-program','delete-event3','delete-deliverable','delete-crochet','delete-quran','delete-book','delete-event4','delete-social','delete-task','delete-timeline'].forEach(actionName=>{
  const original = ACTIONS[actionName];
  ACTIONS[actionName] = function(el){
    confirmAction({ title:'Delete this?', message:'This action cannot be undone.', onConfirm(){ original(el); } });
  };
});

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
